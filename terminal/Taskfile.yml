version: "3"

includes:
  c:
    taskfile: ../common
    dir: ../common
  c2:
    taskfile: ../common2
    dir: ../common2
  l:
    taskfile: ../language
    dir: ../language

tasks:
  generic:
    desc: default action - lists the tasks (you're looking at it)
    silent: true
    cmds:
      - task: alacritty
      - task: ghostty
      - task: iterm
      - task: warp

  # https://alacritty.org/
  #
  alacritty:
    cmds:
      - task: c2:darwin-one
        vars:
          PACKAGE: alacritty
        platforms: [darwin]
      # TODO: https://alacritty.org/ => check installation steps
      - task: c:windows
        vars:
          PACKAGE: ["winget:Alacritty.Alacritty;choco:alacritty;scoop:extras/alacritty"]
        platforms: [windows]
      - task: alacritty:config
    desc: Install Alacritty Termianl (Windows)

  alacritty:config:
    cmds:
      - task: c2:update:config:link
        vars:
          SOURCE: "{{.ROOT_DIR}}/terminal/alacritty.config.toml"
          DESTINATION: "{{.HOME}}/.config/alacritty/alacritty.toml"
        platforms: [darwin, linux]
      - cmd: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ../common/link-config.ps1 -Source alacritty.config.toml -Destination __HOME__/AppData/Roaming/alacritty/alacritty.toml
        platforms: [windows]
    desc: Configure Alacritty

  # https://ghostty.org/
  #
  ghostty:
    desc: Install Ghostty Terminal (Darwin,Linux)
    cmds:
      - task: c2:darwin-one
        vars:
          PACKAGE: cask:ghostty
        platforms: [darwin]
      # TODO: https://ghostty.org/docs/install/binary#linux-(official) => check installation steps
      - task: ghostty:config

  ghostty:config:
    cmds:
      - task: c2:update:config:link
        vars:
          SOURCE: "{{.ROOT_DIR}}/terminal/ghostty.config"
          DESTINATION: "{{.HOME}}/Library/Application Support/com.mitchellh.ghostty/config"
        platforms: [darwin]
      - task: c2:update:config:link
        vars:
          SOURCE: "{{.ROOT_DIR}}/terminal/ghostty.config"
          DESTINATION: "{{.HOME}}/.config/ghostty/config"
        platforms: [linux]
    desc: Configure Ghostty

  # https://iterm2.com/
  #
  iterm:
    desc: Install iTerm Terminal (Darwin)
    cmds:
      - task: c2:darwin-one
        vars:
          PACKAGE: cask:iterm2
        platforms: [darwin]
      - task: c2:darwin-one
        vars:
          PACKAGE: cask:itermai
        platforms: [darwin]
      - task: iterm:config

  iterm:config:
    cmds:
      - cmd: |
          echo "Must write config script for iterm"
        platforms: [darwin, linux]
    desc: Configure Ghostty

  # https://github.com/microsoft/terminal
  #
  terminal:
    desc: Install Terminal (Windows)
    cmds:
      - cmd: |
          echo "Microsoft Terminal is not supported on Darwin and Linux"
        platforms: [darwin, linux]
      - task: c:windows
        vars:
          PACKAGES: [winget:Microsoft.WindowsTerminal;choco:microsoft-windows-terminal;scoop:extras/windows-terminal]
        platforms: [windows]

  # https://www.warp.dev/
  #
  warp:
    desc: Install Warp Terminal (Darwin,Linux,Windows)
    cmds:
      - task: c2:darwin-one
        vars:
          PACKAGE: cask:warp
        platforms: [darwin]
      # TODO: https://www.warp.dev/linux-terminal => check installation steps
      - task: c:windows
        vars:
          PACKAGES: [winget:Warp.Warp;choco:warp;scoop:warp]
        platforms: [windows]
      - task: warp:config

  warp:config:
    cmds:
      - cmd: |
          echo "Must write config script for warp"
        platforms: [darwin, linux]
    desc: Configure Ghostty

  # https://wezterm.org/index.html
  #
  wezterm:
    desc: Install Wezterm Terminal (Windows)
    cmds:
      - task: c2:darwin-one
        vars:
          PACKAGE: wezterm
        platforms: [darwin]
      - task: c:windows
        vars:
          PACKAGES: [winget:wez.wezterm;choco:wezterm;scoop:extras/wezterm]
        platforms: [windows]
      - task: wezterm:config

  wezterm:config:
    cmds:
      - task: c2:update:config:link
        vars:
          SOURCE: "{{.ROOT_DIR}}/terminal/wezterm.config.lua"
          DESTINATION: "{{.HOME}}/.wezterm.lua"
        platforms: [darwin, linux]
      - cmd: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ../common/link-config.ps1 -Source wezterm.config.lua -Destination __HOME__/.wezterm.lua
        platforms: [windows]
    desc: Configure Wezterm
