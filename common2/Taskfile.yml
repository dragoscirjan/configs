version: "3"

# vars:
#   SHELL:
#     sh: bash
#     windows: powershell.exe -NoProfile -ExecutionPolicy Bypass -Command

tasks:
  default:
    silent: true
    cmds:
      - task --list

  backup:
    cmds:
      - cmd: |
          bfile="{{.FILE}}"
          if [ -f "$bfile" ]; then
            backup_file="$bfile.bak.$(date +%Y%m%d_%H%M%S)"
            cp "$bfile" "$backup_file"

            # Rotate: keep only last N backups
            max_backups=5
            backup_count=$(ls -1 "$bfile.bak."* 2>/dev/null | wc -l)

            if [ "$backup_count" -gt "$max_backups" ]; then
              ls -t "$bfile.bak."* | tail -n +$((max_backups + 1)) | while read old_backup; do
                rm -f "$old_backup"
              done
            fi

            # ls -t "$bfile.bak."*
          else
            echo ">> '$bfile' does not exist. Skipping backup..."
          fi
        platforms: [darwin, linux]
      - cmd: |
          echo 'Not implemented for Windows'
        platforms: [windows]

  cache-version:
    cmds:
      - cmd: |
          source ./logging.sh
          source ./version-cache.sh
          log_debug "Caching version for package: {{.PACKAGE}}"
          update_cached_version "{{.PACKAGE}}" "{{.VERSION | default ""}}"
        platforms: [darwin, linux]
    desc: Cache the installed version of a package
    internal: true

  list-cached-versions:
    cmds:
      - |
        source ./logging.sh
        source ./version-cache.sh
        log_info "Listing all cached package versions:"
        list_cached_versions
    desc: List all cached package versions

  clear-version-cache:
    cmds:
      - |
        source ./logging.sh
        source ./version-cache.sh
        log_info "Clearing version cache..."
        clear_version_cache
    desc: Clear all cached package versions

  darwin-one:
    cmds:
      - cmd: |
          ./brew-install.swift --package \
            "{{.PACKAGE}}" {{if .VERSION}}--version \
            '{{.VERSION}}'{{end}} {{if .CLI_FORCE}}--force{{end}}
      - task: cache-version
        vars:
          PACKAGE: "{{.PACKAGE}}"
          VERSION: '{{.VERSION | default ""}}'
    desc: Install one Package under Darwin, using Homebrew
    env:
      PACKAGE: "{{.PACKAGE}}"
      VERSION: '{{.VERSION | default ""}}'
    internal: true
    platforms: [darwin]
    summary: >
      Install one Package under Darwin, using Homebrew

      task darwin-one PACKAGE="pkg1" [VERSION="1.2.3"] [--force]

      task darwin-one PACKAGE="llvm" VERSION="18" # will install llvm@18
      task darwin-one PACKAGE="llvm" VERSION="20" # will remove llvm@18 and install llvm@20

      where pkg1 is a Homebrew package name

  darwin:
    cmds:
      - cmd: |
          source ./logging.sh
          failed_packages=()
          total_packages=({{.PACKAGES}})
          log_info "Installing ${#total_packages[@]} packages: {{.PACKAGES}}"

          for package in {{.PACKAGES}}; do
            log_info "Processing package: $package"
            if ! task darwin-one PACKAGE="$package" {{if .CLI_FORCE}}--force{{end}}; then
              failed_packages+=("$package")
              log_warn "Failed to install: $package"
            fi
          done

          if [[ ${#failed_packages[@]} -gt 0 ]]; then
            log_error "Failed to install packages: ${failed_packages[*]}" 1
          else
            log_success "All packages installed successfully"
          fi
    desc: Install Packages under Darwin, using Homebrew with version management
    internal: true
    platforms: [darwin]
    summary: >
      Install Packages under Darwin, using Homebrew; no update capacity

      task darwin PACKAGES="pkg1 pkg2 pkg3" [--force]

      where pkg1, pkg2, pkg3 are Homebrew package names

  linux:
    cmds:
      - for:
          var: PACKAGES
        cmd: |
          bash ./install.sh --package "{{.ITEM}}" {{if .CLI_FORCE}}--force{{end}}
        platforms: [linux]
    desc: Install Packages under Linux
    internal: true

  windows:
    cmds:
      - for:
          var: PACKAGES
        cmd: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./install.ps1 -Package "{{.ITEM}}" {{if .CLI_FORCE}}-Force{{end}}
        platforms: [windows]
    desc: Install Packages under Windows
    internal: true

  update:shrc:files:
    cmds:
      - for: [$HOME/.zshrc, $HOME/.bashrc, $HOME/.bash_profile]
        task: backup
        vars:
          FILE: "{{.ITEM}}"
      - for: [$HOME/.zshrc, $HOME/.bashrc, $HOME/.bash_profile]
        cmd: |
          set -euo pipefail

          source ./logging.sh

          target_file="{{.ITEM}}"
          line_content='{{.LINE}}'

          # Check if file exists
          if [[ ! -f "${target_file}" ]]; then
            log_info "'${target_file}' does not exist; skipping..."
          else
            # Check if line already exists in file
            if grep -qF "${line_content}" "${target_file}"; then
              log_info "'${target_file}' already contains: ${line_content}"
            else
              # Append line to file
              echo "" >> "${target_file}"
              echo "${line_content}" >> "${target_file}"
              log_info "Added to '${target_file}': ${line_content }"
            fi
          fi

  update:config:link:
    cmds:
      - cmd: |
          set -euo pipefail

          source ./logging.sh

          source_path="{{.SOURCE}}"
          dest_path="{{.DESTINATION}}"
          timestamp=$(date +%s)

          # Check if source exists
          if [[ ! -e "${source_path}" ]]; then
            log_error "Source path '${source_path}' does not exist." 1
          fi

          # Ensure parent directory of destination exists
          parent_dir=$(dirname "${dest_path}")
          if [[ -n "${parent_dir}" ]] && [[ ! -d "${parent_dir}" ]]; then
            log_info "Creating parent directory: ${parent_dir}"
            mkdir -p "${parent_dir}"
          elif [[ -n "${parent_dir}" ]] && [[ -e "${parent_dir}" ]] && [[ ! -d "${parent_dir}" ]]; then
            log_error "Parent path '${parent_dir}' exists but is not a directory." 1
          fi

          # Backup destination if it exists
          if [[ -e "${dest_path}" ]]; then
            backup="${dest_path}.bak.${timestamp}"
            log_info "Backing up existing ${dest_path} to ${backup}"
            mv "${dest_path}" "${backup}"
          fi

          # Create symlink
          if [[ -d "${source_path}" ]]; then
            item_type="directory"
          else
            item_type="file"
          fi

          log_info "Linking ${source_path} to ${dest_path} as ${item_type} symbolic link"
          ln -sf "${source_path}" "${dest_path}"
        platforms: [darwin, linux]
    desc: Create symbolic link from SOURCE to DESTINATION
    summary: >
      Create symbolic link from SOURCE to DESTINATION with automatic backup

      task update:config:link SOURCE="/path/to/source" DESTINATION="/path/to/dest"
