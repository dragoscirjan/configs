version: "3"

includes:
  c:
    taskfile: ../common
    dir: ../common
  c2:
    taskfile: ../common2
    dir: ../common2
  u:
    taskfile: ../utils
    dir: ../utils

tasks:
  generic:
    desc: Install minimal set of used languages
    cmds:
      - task: bash
      - task: pwsh
      - task: zsh
      - task: util:chezmoi
      - task: util:ohmyposh

  bash:
    cmds:
      - task: c2:darwin-one
        vars:
          PACKAGE: bash
        platforms: [darwin]
      - cmd: echo "bash is already installed"
        platforms: [linux]
      - task: c:windows
        vars:
          PACKAGES: ["winget:Git.Git;choco:git;scoop:git"]
        platforms: [windows]
    desc: Install Bash

  fish: # https://fishshell.com/
    cmds:
      - task: c2:darwin-one
        vars:
          PACKAGE: fish
        platforms: [darwin]
      - task: c:linux
        vars:
          PACKAGES: ["apt:fish;apk:fish;dnf:fish;brew:fish"]
        platforms: [linux]
      - cmd: echo "fish shell is only available under wsl or cygwin"
        platforms: [windows]
    desc: Install Fish Shell

  nushell: # https://www.nushell.sh/
    cmds:
      - task: c2:darwin-one
        vars:
          PACKAGE: nushell
        platforms: [darwin]
      - cmd: |
          if command -v apk; then
            echo "https://alpine.fury.io/nushell/" | tee -a /etc/apk/repositories
            apk update
            apk add --allow-untrusted nushell
          elif command -v apt; then
            curl -fsSL https://apt.fury.io/nushell/gpg.key | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/fury-nushell.gpg
            echo "deb https://apt.fury.io/nushell/ /" | sudo tee /etc/apt/sources.list.d/fury.list
            sudo apt update
            sudo apt install nushell
          elif command -v dnf; then
            echo "[gemfury-nushell]
            name=Gemfury Nushell Repo
            baseurl=https://yum.fury.io/nushell/
            enabled=1
            gpgcheck=0
            gpgkey=https://yum.fury.io/nushell/gpg.key" | sudo tee /etc/yum.repos.d/fury-nushell.repo
            sudo dnf install -y nushell
          else
            brew install nushell
          fi
        platforms: [linux]
      - task: c:windows
        vars:
          PACKAGES: ["winget:nushell;choco:nushell;scoop:nu"]
        platforms: [windows]
    desc: Install Nushell

  # nushell:awesome-nu: # https://github.com/nushell/awesome-nu

  pwsh:
    cmds:
      - task: c2:darwin-one
        vars:
          PACKAGE: cask:powershell
        platforms: [darwin]
      - cmd: bash ./pwsh-install.sh
        platforms: [linux]
      - task: c:windows
        vars:
          PACKAGES: ["winget:Microsoft.PowerShell;choco:pwsh;scoop:main/pwsh"]
        platforms: [windows]
    desc: Install Powershell

  zsh:
    cmds:
      - task: c2:darwin-one
        vars:
          PACKAGE: zsh
        platforms: [darwin]
      - task: c:linux
        vars:
          PACKAGES: [apk:zsh;apt:zsh]
        platforms: [linux]
      - cmd: echo "ZSH can only be used in WSL"
        platforms: [windows]
    desc: Install Zsh

  util:chezmoi: # https://www.chezmoi.io/
    cmds:
      - task: c2:darwin-one
        vars:
          PACKAGE: chezmoi
        platforms: [darwin]
    desc: Install chezmoi dotfile manager

  util:ohmyposh: # https://ohmyposh.dev/
    cmds:
      - task: c2:darwin-one
        vars:
          PACKAGE: oh-my-posh
        platforms: [darwin]
      - cmd: |
          mkdir -p ~/.local/bin
          curl -s https://ohmyposh.dev/install.sh | bash -s -- -d ~/.local/bin
        platforms: [linux]
      - cmd: |
          SCRIPT_DIR="{{.ROOT_DIR}}"
          cd ../common2
          task update:shrc:files LINE='eval "$(oh-my-posh init "$(oh-my-posh get shell)" --config "'"$SCRIPT_DIR"'/ohmyposh.config.toml")"'
        platforms: [darwin, linux]
      - task: c:windows
        vars:
          PACKAGES: ["winget:JanDeDobbeleer.OhMyPosh;choco:oh-my-posh"]
        platforms: [windows]
      - cmd: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./ohmyposh-config.ps1
        platforms: [windows]
    desc: Install OhMyPosh
    # deps:
    #   - task: u:zip

  # util:ohmybash: # https://github.com/ohmybash/oh-my-bash
  # util:ohmyfish: # https://github.com/oh-my-fish/oh-my-fish
  # util:starship: # https://starship.rs/
  # util:ohmyzsh: # https://ohmyz.sh/
